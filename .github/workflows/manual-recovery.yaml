name: Manual Recovery Run

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Specific repository to target (e.g. owner/repo, or blank for all)'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Run in safe dry-run mode (no branches, PRs, or commits created)'
        type: boolean
        required: true
        default: true
      log_level:
        description: 'Log verbosity level'
        type: choice
        options:
          - DEBUG
          - INFO
          - WARNING
          - ERROR
        default: INFO

concurrency:
  group: repopilot-execution
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  manual-run:
    name: Execute Manual Recovery Run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out RepoPilot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Targeted Recovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CMD_ARGS="--log-level ${{ inputs.log_level }} --report-out recovery-report.json"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD_ARGS="$CMD_ARGS --dry-run"
          fi
          if [ -n "${{ inputs.target_repo }}" ]; then
            CMD_ARGS="$CMD_ARGS --repo ${{ inputs.target_repo }}"
          fi

          if [ ! -f "config/repos.yaml" ]; then
            cp config/repos.example.yaml config/repos.yaml
          fi

          repopilot --config config/repos.yaml $CMD_ARGS

      - name: Archive Recovery Report Artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: manual-recovery-report
          path: recovery-report.json
          retention-days: 7
